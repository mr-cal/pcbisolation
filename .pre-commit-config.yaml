repos:
  - repo: local
    hooks:
      - id: strip-exif
        name: Strip EXIF metadata from images
        language: system
        entry: scripts/strip-exif.sh
        types: [image]
        exclude: \.(svg|gif)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
